<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/admin :: panel('Pacientes', 'pacientes', ~{:: #contenido}, ~{:: #cssExtra}, ~{:: #jsExtra})}">

<body>
    <th:block id="contenido">
        <header class="mb-4">
            <h1 class="display-6">Pacientes</h1>
            <p class="text-secondary mb-0">Consulta r&aacute;pidamente la informaci&oacute;n de las mascotas atendidas.</p>
        </header>

        <section aria-labelledby="tituloListaPacientes">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 id="tituloListaPacientes" class="h5 mb-0">Pacientes registrados</h2>
                <span id="contadorPacientes" class="badge text-bg-secondary"
                    th:text="${#lists.isEmpty(mascotas)} ? '0 pacientes'
                        : ${#lists.size(mascotas)} + ' pacientes'">3 pacientes</span>
            </div>
            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="gridPacientes">
                <div class="col" th:each="mascota : ${mascotas}">
                    <article class="card h-100 shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start gap-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div>
                                        <h3 class="h5 mb-1" th:text="${mascota.nombre}">Luna</h3>
                                        <p class="small text-secondary mb-0">
                                            <span th:text="${mascota.especie}">Perro</span>
                                            <span th:if="${!#strings.isEmpty(mascota.raza)}">
                                                &middot;
                                                <span th:text="${mascota.raza}">Border Collie</span>
                                            </span>
                                        </p>
                                    </div>
                                </div>
                                <span class="badge"
                                    th:classappend="${mascota.activa} ? 'text-bg-success' : 'text-bg-secondary'"
                                    th:text="${mascota.activa} ? 'activo' : 'inactivo'">activo</span>
                            </div>
                            <hr>
                            <dl class="row small mb-0">
                                <dt class="col-5 text-secondary">Propietario</dt>
                                <dd class="col-7" th:text="${duenios[mascota.id]}">Mar&iacute;a Gonz&aacute;lez</dd>
                                <dt class="col-5 text-secondary">Edad</dt>
                                <dd class="col-7" th:text="${mascota.edad}">4 a&ntilde;os</dd>
                                <dt class="col-5 text-secondary">Visitas</dt>
                                <dd class="col-7" th:text="${mascota.visitas}">12</dd>
                            </dl>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </th:block>

    <th:block id="cssExtra"></th:block>
    <th:block id="jsExtra"></th:block>
</body>

</html>
