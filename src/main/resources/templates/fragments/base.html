<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Ticket de Brayan: base del HTML (meta, title dinamico y assets globales) -->
    <th:block th:fragment="paginaHead(titulo)">
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <meta content="VetLife, cl&iacute;nica veterinaria y gesti&oacute;n de citas para mascotas." name="description" />
        <title th:text="${titulo} + ' | VetLife'">VetLife</title>
        <link crossorigin="anonymous"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            rel="stylesheet" />
        <link th:href="@{/assets/css/estilos.css}" href="/assets/css/estilos.css" rel="stylesheet" />
    </th:block>
    <!-- Fin Ticket de Brayan -->
</head>

<body>
    <!-- Ticket de Brayan: scripts globales (bundle de Bootstrap) -->
    <th:block th:fragment="scripts">
        <script crossorigin="anonymous"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>
    <!-- Fin Ticket de Brayan -->
</body>

</html>
