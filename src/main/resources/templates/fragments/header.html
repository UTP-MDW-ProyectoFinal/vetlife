<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <header th:fragment="navbar">
        <nav aria-label="Navegaci&oacute;n principal"
            class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
            <div class="container py-2">
                <a class="navbar-brand d-flex align-items-center gap-2" href="/" th:href="@{/}">
                    <img alt="Logo de VetLife" class="img-fluid" src="/img/iconoW.jpeg"
                        style="max-width: 120px;" th:src="@{/img/iconoW.jpeg}" />
                </a>
                <button aria-controls="menuPrincipal" aria-label="Abrir men&uacute;"
                    class="navbar-toggler" data-bs-target="#menuPrincipal" data-bs-toggle="collapse"
                    type="button">
                    <span class="small fw-semibold">Men&uacute;</span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav mx-lg-auto mb-3 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" data-pagina-nav="inicio" href="/" th:href="@{/}">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-pagina-nav="servicios" href="/servicios"
                                th:href="@{/servicios}">Servicios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-pagina-nav="citas" href="/citas"
                                th:href="@{/citas}">Reservar cita</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-pagina-nav="contacto" href="/contacto"
                                th:href="@{/contacto}">Contacto</a>
                        </li>
                    </ul>
                    <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2"
                        th:if="${session == null or session.rol == null}">
                        <a class="nav-link" href="/login" th:href="@{/login}">Iniciar sesi&oacute;n</a>
                        <a class="btn btn-primary btn-sm px-3" href="/registro"
                            th:href="@{/registro}">Crear cuenta</a>
                    </div>
                    <div class="dropdown ms-lg-2" th:if="${session != null and session.rol != null}">
                        <button aria-expanded="false" class="btn border-0 d-flex align-items-center gap-2 dropdown-toggle"
                            data-bs-toggle="dropdown" type="button">
                            <span class="avatar-usuario rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center fw-bold"
                                th:text="${session.nombre != null ? #strings.substring(session.nombre, 0, 1) : 'U'}">U</span>
                            <span class="fw-semibold text-truncate d-none d-lg-inline"
                                style="max-width: 140px;" th:text="${session.nombre}">Usuario</span>
                        </button>
                        <ul aria-label="Opciones de cuenta" class="dropdown-menu dropdown-menu-end">
                            <li>
                                <h6 class="dropdown-header text-truncate" style="max-width: 200px;"
                                    th:text="${session.nombre}">Usuario</h6>
                            </li>
                            <li>
                                <p class="dropdown-item-text small text-secondary text-truncate mb-1"
                                    style="max-width: 200px;" th:text="${session.correo}">correo</p>
                            </li>
                            <li>
                                <hr class="dropdown-divider" />
                            </li>
                            <li th:if="${session.rol == 'usuario'}">
                                <a class="dropdown-item" href="/perfil" th:href="@{/perfil}">
                                    <i class="bi bi-person me-2" aria-hidden="true"></i>Mi perfil
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item text-danger" href="/logout" th:href="@{/logout}">
                                    <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Cerrar sesi&oacute;n
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>

</html>
