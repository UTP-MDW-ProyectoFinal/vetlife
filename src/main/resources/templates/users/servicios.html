<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: pagina('Servicios', 'servicios', ~{:: #contenido}, ~{:: #cssExtra}, ~{:: #jsExtra})}">

<body>
    <th:block id="contenido">
        <main>
            <section class="py-5 bg-primary-subtle border-bottom border">
                <div class="container">
                    <p class="text-uppercase small fw-semibold text-primary mb-2">
                        Atenci&oacute;n veterinaria
                    </p>
                    <h1 class="display-5 font-heading">
                        Nuestros servicios
                    </h1>
                    <p class="lead text-secondary mb-0 ancho-texto">
                        Explora las especialidades disponibles y encuentra la atenci&oacute;n que necesita tu
                        mascota.
                    </p>
                </div>
            </section>
            <section class="py-5 container">
                <section class="mb-5" th:each="categoria : ${categorias}">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <span class="badge bg-primary-subtle text-primary"
                            th:text="${categoria.key}">Cirug&iacute;a</span>
                        <span class="text-secondary small"
                            th:text="${#lists.size(categoria.value)} + ' servicios'">3 servicios</span>
                    </div>
                    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
                        <article class="col" th:each="servicio : ${categoria.value}">
                            <div class="card shadow-sm h-100">
                                <div class="card-body p-4">
                                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mb-3" style="width:48px;height:48px;">
                                        <i class="bi fs-4" th:classappend="${servicio.icono}"></i>
                                    </div>
                                    <h2 class="h5" th:text="${servicio.nombre}">Laparoscop&iacute;a</h2>
                                    <p class="small text-secondary mb-3">Atenci&oacute;n veterinaria con seguimiento profesional y registro digital.</p>
                                    <div class="d-flex justify-content-between small">
                                        <span th:text="${servicio.duracion}">1 h</span>
                                        <strong class="text-primary"
                                            th:text="'S/ ' + ${#numbers.formatDecimal(servicio.precio, 1, 'POINT', 2, 'POINT')}">S/ 180.00</strong>
                                    </div>
                                </div>
                            </div>
                        </article>
                    </div>
                </section>
            </section>
        </main>
    </th:block>

    <th:block id="cssExtra"></th:block>
    <th:block id="jsExtra"></th:block>
</body>

</html>
