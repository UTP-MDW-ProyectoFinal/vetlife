<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="VetLife, cl&iacute;nica veterinaria y gesti&oacute;n de citas para mascotas." name="description" />
    <title>
        Registrar mascota | VetLife
    </title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet" />
<link th:href="@{/assets/css/estilos.css}" rel="stylesheet" />
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="auth-shell">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="card shadow-sm">
                        <div class="card-body p-4 p-lg-5">
                            <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
                                <div>
                                    <span class="badge bg-primary-subtle text-primary">
                                        Paso 2 de 2
                                    </span>
                                    <h1 class="h2 font-heading mt-2">
                                        Datos de tu mascota
                                    </h1>
                                    <p class="text-secondary mb-0">
                                        Completa los datos b&aacute;sicos para agilizar
                                        futuras reservas.
                                    </p>
                                </div>
                            </div>
                            <form class="row g-4" id="formularioMascota">
                                <div class="col-md-6">
                                    <label class="form-label" for="mascotaNombre">
                                        Nombre
                                    </label>
                                    <input class="form-control" id="mascotaNombre" required="" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="mascotaRaza">
                                        Raza
                                    </label>
                                    <input class="form-control" id="mascotaRaza" placeholder="Ej. Labrador" />
                                </div>
                                <fieldset class="col-12">
                                    <legend class="form-label fs-6">
                                        Especie
                                    </legend>
                                    <div class="row row-cols-2 row-cols-md-5 g-2">
                                        <div class="col">
                                            <input autocomplete="off" class="btn-check" id="especie1" name="especie"
                                                type="radio" value="Perro" />
                                            <label class="btn btn-outline-secondary w-100" for="especie1">
                                                Perro
                                            </label>
                                        </div>
                                        <div class="col">
                                            <input autocomplete="off" class="btn-check" id="especie2" name="especie"
                                                type="radio" value="Gato" />
                                            <label class="btn btn-outline-secondary w-100" for="especie2">
                                                Gato
                                            </label>
                                        </div>
                                        <div class="col">
                                            <input autocomplete="off" class="btn-check" id="especie3" name="especie"
                                                type="radio" value="Ave" />
                                            <label class="btn btn-outline-secondary w-100" for="especie3">
                                                Ave
                                            </label>
                                        </div>
                                        <div class="col">
                                            <input autocomplete="off" class="btn-check" id="especie4" name="especie"
                                                type="radio" value="Conejo" />
                                            <label class="btn btn-outline-secondary w-100" for="especie4">
                                                Conejo
                                            </label>
                                        </div>
                                        <div class="col">
                                            <input autocomplete="off" class="btn-check" id="especie5" name="especie"
                                                type="radio" value="Reptil" />
                                            <label class="btn btn-outline-secondary w-100" for="especie5">
                                                Reptil
                                            </label>
                                        </div>
                                    </div>
                                </fieldset>
                                <div class="col-md-6">
                                    <label class="form-label" for="mascotaEdad">
                                        Edad
                                    </label>
                                    <input class="form-control" id="mascotaEdad" placeholder="Ej. 4 a&ntilde;os" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="mascotaSexo">
                                        Sexo
                                    </label>
                                    <select class="form-select" id="mascotaSexo">
                                        <option value="Hembra">
                                            Hembra
                                        </option>
                                        <option value="Macho">
                                            Macho
                                        </option>
                                    </select>
                                </div>
                                <div class="col-12 d-flex flex-column flex-sm-row gap-2 justify-content-end">
                                    <a class="btn btn-light border" th:href="@{/reservas}" href="/reservas">
                                        Ahora no
                                    </a>
                                    <button class="btn btn-primary" type="submit">
                                        Guardar mascota
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div class="position-fixed end-0 bottom-0 m-3" id="contenedorToast">
    </div>
    <script crossorigin="anonymous" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/assets/js/datos.js}"></script>
    <script th:src="@{/assets/js/utilidades.js}"></script>
    <script th:src="@{/assets/js/mascotas.js}"></script>
    <script th:src="@{/assets/js/app.js}"></script>
</body>

</html>
