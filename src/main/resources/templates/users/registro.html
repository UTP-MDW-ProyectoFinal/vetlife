<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="Crea tu cuenta de VetLife para gestionar tus mascotas y reservas." name="description" />
    <title>Crear cuenta | VetLife</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet" />
    <link th:href="@{/assets/css/estilos.css}" rel="stylesheet" />
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="login-pagina d-flex align-items-start align-items-lg-center py-5">
        <div class="container">
            <div class="login-panel row g-0 mx-auto">
                <aside class="col-md-5 login-mensaje d-flex flex-column">
                    <p class="fw-bold mb-5">VetLife</p>
                    <div class="my-md-auto">
                        <h1 class="font-heading display-6 fw-semibold lh-sm mb-3">Bienvenidos<br />a la familia.</h1>
                        <p class="mb-0">Crea tu cuenta para cuidar mejor de tus compañeros.</p>
                    </div>
                </aside>
                <section class="col-md-7 login-formulario">
                    <h2 class="font-heading h2 mb-2">Crear cuenta</h2>
                    <p class="text-secondary mb-4">Registra tus datos para continuar.</p>
                    <div class="alert alert-danger" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></div>
                    <form class="row g-3" method="post" th:action="@{/registro}">
                        <div class="col-sm-6">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input autocomplete="given-name" class="form-control" id="nombre" name="nombre" required />
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="apellido">Apellido</label>
                            <input autocomplete="family-name" class="form-control" id="apellido" name="apellido" required />
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="dni">DNI</label>
                            <input autocomplete="off" class="form-control" id="dni" name="dni" required />
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="telefono">Teléfono</label>
                            <input autocomplete="tel" class="form-control" id="telefono" name="telefono" required type="tel" />
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="correo">Correo electrónico</label>
                            <input autocomplete="email" class="form-control" id="correo" name="correo" required type="email" />
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="contrasena">Contraseña</label>
                            <input autocomplete="new-password" class="form-control" id="contrasena" name="contrasena"
                                minlength="8" required type="password" />
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="confirmarContrasena">Confirmar contraseña</label>
                            <input autocomplete="new-password" class="form-control" id="confirmarContrasena"
                                name="confirmarContrasena" minlength="8" required type="password" />
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
                        </div>
                    </form>
                    <p class="small text-secondary mt-4 mb-0">
                        ¿Ya tienes cuenta? <a class="link-primary fw-semibold" th:href="@{/login}">Iniciar sesión</a>
                    </p>
                </section>
            </div>
        </div>
    </main>
    <script crossorigin="anonymous"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
