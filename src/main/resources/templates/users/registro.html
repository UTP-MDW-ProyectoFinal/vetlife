<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: pagina('Crear cuenta', null, ~{:: #contenido}, ~{:: #cssExtra}, ~{:: #jsExtra})}">

<body>
    <th:block id="contenido">
        <main class="min-vh-100 d-flex align-items-center py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-10">
                        <div class="card border-0 shadow-sm overflow-hidden">
                            <div class="row g-0">
                                <aside class="bg-primary text-white col-md-5 p-4 p-lg-5">
                                    <span class="badge bg-light text-dark mb-4">
                                        Paso 1 de 2
                                    </span>
                                    <h1 class="display-6 font-heading">
                                        Crea tu cuenta
                                    </h1>
                                    <p class="opacity-75">
                                        Primero registramos tus datos. Despu&eacute;s
                                        podr&aacute;s a&ntilde;adir a tu mascota y reservar una
                                        cita.
                                    </p>
                                    <ol class="small opacity-75 ps-3 mt-4">
                                        <li class="mb-2">
                                            Datos del propietario
                                        </li>
                                        <li>
                                            Datos de la mascota
                                        </li>
                                    </ol>
                                </aside>
                                <section class="col-md-7 p-4 p-lg-5">
                                    <h2 class="h3 font-heading">
                                        Datos del propietario
                                    </h2>
                                    <form class="row g-3 mt-2" id="formularioRegistro">
                                        <div class="col-md-6">
                                            <label class="form-label" for="registroNombre">
                                                Nombre
                                            </label>
                                            <input class="form-control" id="registroNombre" required="" />
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="registroApellido">
                                                Apellido
                                            </label>
                                            <input class="form-control" id="registroApellido" required="" />
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="registroDni">
                                                DNI
                                            </label>
                                            <input class="form-control" id="registroDni" inputmode="numeric" required="" />
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="registroTelefono">
                                                Tel&eacute;fono
                                            </label>
                                            <input class="form-control" id="registroTelefono" required="" type="tel" />
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label" for="registroCorreo">
                                                Correo electr&oacute;nico
                                            </label>
                                            <input autocomplete="email" class="form-control" id="registroCorreo" required=""
                                                type="email" />
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="registroContrasena">
                                                Contrase&ntilde;a
                                            </label>
                                            <input autocomplete="new-password" class="form-control" id="registroContrasena"
                                                minlength="6" required="" type="password" />
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="registroConfirmarContrasena">
                                                Confirmar contrase&ntilde;a
                                            </label>
                                            <input autocomplete="new-password" class="form-control"
                                                id="registroConfirmarContrasena" minlength="6" required=""
                                                type="password" />
                                        </div>
                                        <div class="col-12">
                                            <button class="btn btn-primary w-100" type="submit">
                                                Continuar con mi mascota
                                            </button>
                                        </div>
                                    </form>
                                    <p class="small text-secondary mt-4 mb-0">
                                        &iquest;Ya tienes una cuenta?
                                        <a class="text-primary fw-semibold" href="/login" th:href="@{/login}">
                                            Iniciar sesi&oacute;n
                                        </a>
                                    </p>
                                </section>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </th:block>

    <th:block id="cssExtra"></th:block>
    <th:block id="jsExtra"></th:block>
</body>

</html>
