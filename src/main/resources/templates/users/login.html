<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8" />
	<meta content="width=device-width, initial-scale=1" name="viewport" />
	<meta content="Inicia sesión en VetLife para gestionar las mascotas y reservas de tu cuenta." name="description" />
	<title>Iniciar sesión | VetLife</title>
	<link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet" />
	<link th:href="@{/assets/css/estilos.css}" rel="stylesheet" />
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<main class="login-pagina d-flex align-items-start align-items-lg-center py-5">
		<div class="container">
			<div class="login-panel row g-0 mx-auto">
				<aside class="col-md-5 login-mensaje d-flex flex-column">
					<p class="fw-bold mb-5">VetLife</p>
					<div class="my-md-auto">
						<h1 class="font-heading display-6 fw-semibold lh-sm mb-3">Tu mascota,<br />primero.</h1>
						<p class="mb-0">Accede para gestionar tus mascotas y reservas desde un solo lugar.</p>
					</div>
				</aside>
				<section class="col-md-7 login-formulario">
					<h2 class="font-heading h2 mb-2">Iniciar sesión</h2>
					<p class="text-secondary mb-4">Usa tu correo/DNI o las credenciales de administrador de demostración.</p>

					<div class="alert alert-success" role="status" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
					<div class="alert alert-success" role="status" th:if="${loginCorrecto}">
						Acceso correcto. Estamos preparando tu cuenta...
					</div>
					<div class="alert alert-danger" role="alert" th:if="${mensajeError}">
						<span th:text="${mensajeError}"></span>
						<a class="alert-link d-block mt-1" th:if="${sinCuenta}" th:href="@{/registro}">Crear una cuenta</a>
					</div>

					<form method="post" th:action="@{/login}" th:unless="${loginCorrecto}">
						<input name="redirect" th:value="${redirect}" type="hidden" />
						<div class="mb-3">
							<label class="form-label" for="usuario">Correo, DNI o usuario</label>
							<input autocomplete="username" autofocus class="form-control" id="usuario" name="usuario"
								required type="text" />
						</div>
						<div class="mb-4">
							<label class="form-label" for="contrasena">Contraseña</label>
							<div class="input-group">
								<input autocomplete="current-password" class="form-control" id="contrasena"
									name="contrasena" required type="password" />
								<button aria-label="Mostrar contraseña" class="btn btn-outline-secondary"
									data-mostrar-contrasena type="button">Mostrar</button>
							</div>
						</div>
						<button class="btn btn-primary w-100" type="submit">Ingresar</button>
					</form>

					<p class="small text-secondary mt-4 mb-0" th:unless="${loginCorrecto}">
						¿Aún no tienes cuenta? <a class="link-primary fw-semibold" th:href="@{/registro}">Crear cuenta</a>
					</p>
				</section>
			</div>
		</div>
	</main>
	<script th:if="${loginCorrecto}" th:inline="javascript">
		const perfilVetLife = {
			nombre: /*[[${nombreUsuario}]]*/ "",
			apellido: /*[[${apellidoUsuario} ?: '']]*/ "",
			dni: /*[[${dniUsuario} ?: '']]*/ "",
			telefono: /*[[${telefonoUsuario} ?: '']]*/ "",
			correo: /*[[${correoUsuario}]]*/ ""
		};
		const sesionVetLife = {
			rol: /*[[${rolUsuario}]]*/ "usuario",
			nombre: perfilVetLife.nombre,
			correo: perfilVetLife.correo
		};
		if (sesionVetLife.rol === "usuario") {
			localStorage.setItem("vetlife_cuenta_v2", JSON.stringify(perfilVetLife));
		}
		localStorage.setItem("vetlife_sesion_v2", JSON.stringify(sesionVetLife));
		window.location.replace(/*[[${destino}]]*/ "/reservas");
	</script>
	<script>
		document.querySelector("[data-mostrar-contrasena]")?.addEventListener("click", (evento) => {
			const boton = evento.currentTarget;
			const campo = document.getElementById("contrasena");
			const visible = campo.type === "password";
			campo.type = visible ? "text" : "password";
			boton.textContent = visible ? "Ocultar" : "Mostrar";
			boton.setAttribute("aria-label", visible ? "Ocultar contraseña" : "Mostrar contraseña");
		});
	</script>
	<script crossorigin="anonymous"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
