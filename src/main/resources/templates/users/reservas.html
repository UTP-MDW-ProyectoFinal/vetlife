<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: pagina('Mis reservas', null, ~{:: #contenido}, ~{:: #cssExtra}, ~{:: #jsExtra})}">

<body>
    <th:block id="contenido">
        <main class="container py-5">
            <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
                <div>
                    <p class="text-uppercase small fw-semibold text-primary mb-2">
                        Cuenta
                    </p>
                    <h1 class="display-6 font-heading mb-1">
                        Mis reservas
                    </h1>
                    <p class="text-secondary mb-0">
                        Consulta el estado de tus citas.
                    </p>
                </div>
                <a class="btn btn-primary" href="/citas" th:href="@{/citas}">
                    Nueva cita
                </a>
            </header>
            <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}">
                Cita reservada correctamente.
            </div>
            <section id="listaReservas">
                <div th:if="${reservas == null or reservas.isEmpty()}" class="text-center py-5">
                    <p class="text-secondary mb-3">A&uacute;n no tienes citas reservadas.</p>
                    <a class="btn btn-primary" href="/citas" th:href="@{/citas}">Reservar mi primera cita</a>
                </div>
                <article class="card card shadow-sm mb-3" th:each="reserva : ${reservas}">
                    <div class="card-body p-4">
                        <div class="row align-items-center g-4">
                            <div class="col-lg-8">
                                <span class="badge text-bg-warning mb-2" th:text="${reserva.estado}">pendiente</span>
                                <h2 class="h5 mb-2" th:text="${reserva.servicio}">Consulta General</h2>
                                <p class="text-secondary mb-1"
                                    th:text="${reserva.fecha} + ' · ' + ${reserva.hora}">28/08/2026 · 08:30</p>
                                <p class="small text-secondary mb-0" th:text="${reserva.mascotaNombre}">Luna</p>
                            </div>
                            <div class="col-lg-4 text-lg-end">
                                <small class="text-secondary d-block">C&oacute;digo</small>
                                <div class="font-monospace mb-3" th:text="${reserva.id}">C-1001</div>
                            </div>
                        </div>
                    </div>
                </article>
            </section>
        </main>
    </th:block>

    <th:block id="cssExtra"></th:block>
    <th:block id="jsExtra"></th:block>
</body>

</html>
