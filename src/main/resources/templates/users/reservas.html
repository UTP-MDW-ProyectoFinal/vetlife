<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="VetLife, cl&iacute;nica veterinaria y gesti&oacute;n de citas para mascotas." name="description" />
    <title>
        Mis reservas | VetLife
    </title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet" />
    <link th:href="@{/assets/css/estilos.css}" href="/assets/css/estilos.css" rel="stylesheet" />
</head>

<body data-requiere="usuario">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container py-5">
        <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
            <div>
                <p class="text-uppercase small fw-semibold text-primary mb-2">
                    Cuenta
                </p>
                <h1 class="display-6 font-heading mb-1">
                    Mis reservas
                </h1>
                <p class="text-secondary mb-0">
                    Consulta el estado de tus citas.
                </p>
            </div>
            <a class="btn btn-primary" th:href="@{/citas}" href="/citas">
                Nueva cita
            </a>
        </header>
        <section id="listaReservas">
        </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div class="position-fixed end-0 bottom-0 m-3" id="contenedorToast">
    </div>
    <script crossorigin="anonymous" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>
    <script th:src="@{/assets/js/utilidades.js}" src="/assets/js/utilidades.js"></script>
    <script th:src="@{/assets/js/datos.js}" src="/assets/js/datos.js"></script>
    <script th:src="@{/assets/js/autenticacion.js}" src="/assets/js/autenticacion.js"></script>
    <script th:src="@{/assets/js/citas.js}" src="/assets/js/citas.js"></script>
    <script th:src="@{/assets/js/app.js}" src="/assets/js/app.js"></script>
</body>

</html>
