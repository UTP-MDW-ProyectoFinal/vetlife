<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="VetLife, cl&iacute;nica veterinaria y gesti&oacute;n de citas para mascotas." name="description" />
    <title>
        Mi perfil | VetLife
    </title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet" />
<link th:href="@{/assets/css/estilos.css}" rel="stylesheet" />
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container py-5">
        <header class="mb-4">
            <p class="text-uppercase small fw-semibold text-primary mb-2">
                Cuenta
            </p>
            <h1 class="display-6 font-heading">
                Mi perfil
            </h1>
            <p class="text-secondary">
                Administra tus datos y consulta las mascotas registradas.
            </p>
        </header>
        <div class="row g-4">
            <section class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-lg-5">
                        <h2 class="h5 font-heading">
                            Datos personales
                        </h2>
                        <form class="row g-3 mt-1" id="formularioPerfil">
                            <div class="col-md-6">
                                <label class="form-label" for="perfilNombre">
                                    Nombre
                                </label>
                                <input class="form-control" id="perfilNombre" required="" th:value="${nombreUsuario}" />                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="perfilApellido">
                                    Apellido
                                </label>
                                <input class="form-control" id="perfilApellido" required="" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="perfilDni">
                                    DNI
                                </label>
                                <input class="form-control" id="perfilDni" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="perfilTelefono">
                                    Tel&eacute;fono
                                </label>
                                <input class="form-control" id="perfilTelefono" type="tel" />
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="perfilCorreo">
                                    Correo
                                </label>
                                <input class="form-control" id="perfilCorreo" type="email" />
                            </div>
                            <div class="col-12">
                                <button class="btn btn-primary" type="submit">
                                    Guardar cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
            <aside class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 font-heading mb-0">
                                Mis mascotas
                            </h2>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/mascota(from='perfil')}" href="/mascota?from=perfil">
                                A&ntilde;adir
                            </a>
                        </div>
                        <div id="listaMascotasPerfil">
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div class="position-fixed end-0 bottom-0 m-3" id="contenedorToast">
    </div>
    <script crossorigin="anonymous" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/assets/js/datos.js}"></script>
    <script th:src="@{/assets/js/utilidades.js}"></script>
    <script th:src="@{/assets/js/mascotas.js}"></script>
    <script th:src="@{/assets/js/app.js}"></script>
</body>

</html>
